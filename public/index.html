<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa 🎅</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎄 Secret Santa Gift Exchange 🎅</h1>
            <p class="subtitle">Manage your wishlist and discover clues from your Secret Santa!</p>
        </header>

        <main id="participants-container">
            <!-- Participants will be loaded here dynamically -->
        </main>
    </div>

    <!-- Modal for editing gifts -->
    <div id="gift-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Gift to Wishlist</h2>
            <input type="hidden" id="modal-participant-id">
            <input type="text" id="gift-input" placeholder="Enter gift description">
            <button id="add-gift-btn" class="btn btn-primary">Add Gift</button>
        </div>
    </div>

    <!-- Modal for adding clues -->
    <div id="clue-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Leave a Clue</h2>
            <input type="hidden" id="clue-participant-id">
            <textarea id="clue-input" placeholder="Enter a mysterious clue..."></textarea>
            <button id="add-clue-btn" class="btn btn-secondary">Leave Clue</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
